### LLaMA-Factory SFT Training Config for LLaMA3.1-8B-Instruct + CoT (Spider)
### AutoDL RTX 5090 32G

### Model
model_name_or_path: /root/autodl-tmp/models/meta-llama/Meta-Llama-3.1-8B-Instruct
trust_remote_code: true
quantization_bit: 4

### Method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05

### Dataset
dataset: text2sql_cot_spider_train
template: llama3

cutoff_len: 2048

### Output
output_dir: /root/autodl-tmp/llama31_8b_text2sql_cot_spider
logging_steps: 10
save_steps: 500
save_total_limit: 2
overwrite_output_dir: true

### Train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-4
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### Eval
val_size: 0
eval_strategy: "no"

### Misc
report_to: tensorboard
